<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Buku</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #d9d9d9;
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        padding: 12px 18px 10px;
      }

      .panel {
        width: 100%;
        max-width: 1500px;
        margin: 0 auto;
        background: #efefef;
        border: 2px solid #5f5f5f;
        border-radius: 0;
        padding: 18px 20px 12px;
      }

      .content {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        column-gap: 50px;
        align-items: start;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 17px;
        margin-top: 10px;
      }

      th,
      td {
        padding: 8px 10px 6px 0;
        text-align: left;
        vertical-align: top;
      }

      th {
        font-weight: 700;
        padding-bottom: 10px;
      }

      td:nth-child(1),
      th:nth-child(1) {
        width: 36%;
      }

      td:nth-child(2),
      th:nth-child(2) {
        width: 24%;
      }

      td:nth-child(3),
      th:nth-child(3) {
        width: 18%;
      }

      td:nth-child(4),
      th:nth-child(4) {
        width: 22%;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        margin: 18px 0 8px;
      }

      .form-section {
        margin-top: 10px;
      }

      .field {
        display: grid;
        grid-template-columns: 120px 1fr;
        align-items: center;
        margin-bottom: 14px;
        gap: 10px;
      }

      .field label {
        font-size: 18px;
        font-weight: 400;
      }

      input,
      select {
        width: 100%;
        height: 30px;
        border: 1px solid #6b6b6b;
        background: #f5f5f5;
        font-size: 16px;
        padding: 4px 8px;
        outline: none;
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #333 50%),
          linear-gradient(135deg, #333 50%, transparent 50%);
        background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        padding-right: 28px;
      }

      .button-wrap {
        margin-top: 12px;
        padding-top: 10px;
      }

      .btn {
        display: inline-block;
        padding: 8px 24px;
        background: #ececec;
        border: 1px solid #4a4a4a;
        color: #111;
        font-size: 16px;
        cursor: pointer;
      }

      .footer {
        margin-top: 32px;
        padding-top: 6px;
        border-top: 1px solid #a9a9a9;
        font-size: 16px;
        color: #111;
        letter-spacing: 0;
      }

      @media (max-width: 900px) {
        .content {
          grid-template-columns: 1fr;
        }

        .field {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <div class="content">
          <section>
            <table>
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Penulis</th>
                  <th>Tahun Terbit</th>
                  <th>Status Baca</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Laskar Pelangi</td>
                  <td>Andrea Hirata</td>
                  <td>2005</td>
                  <td>Selesai</td>
                </tr>
                <tr>
                  <td>Bumi Manusia</td>
                  <td>Pramoedya Ananta Toer</td>
                  <td>1980</td>
                  <td>Sedang dibaca</td>
                </tr>
                <tr>
                  <td>Pulang</td>
                  <td>Tereliye</td>
                  <td>2015</td>
                  <td>Belum dibaca</td>
                </tr>
                <tr>
                  <td>Sapiens</td>
                  <td>Yuval Noah Harari</td>
                  <td>2014</td>
                  <td>Selesai</td>
                </tr>
              </tbody>
            </table>
          </section>

          <aside class="form-section">
            <h2 class="title">Tambah Buku Baru</h2>

            <div class="field">
              <label for="judul">Judul buku</label>
              <input id="judul" type="text" />
            </div>

            <div class="field">
              <label for="penulis">Penulis</label>
              <input id="penulis" type="text" />
            </div>

            <div class="field">
              <label for="tahun">Tahun terbit</label>
              <input id="tahun" type="text" />
            </div>

            <div class="field">
              <label for="status">Status baca</label>
              <select id="status">
                <option>Pilih status</option>
                <option>Selesai</option>
                <option>Sedang dibaca</option>
                <option>Belum dibaca</option>
              </select>
            </div>

            <div class="button-wrap">
              <button class="btn" type="button">Simpan</button>
            </div>
          </aside>
        </div>

        <div class="footer">
          M Vyo Fachmil Fachry Setiawan - NIM 25523238 • 2026
        </div>
      </div>
    </div>
  </body>
</html>
