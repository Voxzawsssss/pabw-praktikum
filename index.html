<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Buku</title>
  </head>
  <body>
    <div>
      <div>
        <div>
          <section>
            <table>
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Penulis</th>
                  <th>Tahun Terbit</th>
                  <th>Status Baca</th>
                  <th>Cover</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Laskar Pelangi</td>
                  <td>Andrea Hirata</td>
                  <td>2005</td>
                  <td>Selesai</td>
                  <td><img class="cover-img" src="assets/covers/laskar-pelangi.svg" alt="Laskar Pelangi cover"/></td>
                </tr>
                <tr>
                  <td>Bumi Manusia</td>
                  <td>Pramoedya Ananta Toer</td>
                  <td>1980</td>
                  <td>Sedang dibaca</td>
                  <td><img class="cover-img" src="assets/covers/bumi-manusia.svg" alt="Bumi Manusia cover"/></td>
                </tr>
                <tr>
                  <td>Pulang</td>
                  <td>Tereliye</td>
                  <td>2015</td>
                  <td>Belum dibaca</td>
                  <td><img class="cover-img" src="assets/covers/placeholder.svg" alt="Placeholder cover"/></td>
                </tr>
                <tr>
                  <td>Sapiens</td>
                  <td>Yuval Noah Harari</td>
                  <td>2014</td>
                  <td>Selesai</td>
                  <td><img class="cover-img" src="assets/covers/placeholder.svg" alt="Placeholder cover"/></td>
                </tr>
              </tbody>
            </table>
          </section>

          <aside>
            <h2>Tambah Buku Baru</h2>

            <div>
              <label for="judul">Judul buku</label>
              <input id="judul" type="text" />
            </div>
            <div>
              <label for="penulis">Penulis</label>
              <input id="penulis" type="text" />
            </div>
            <div>
              <label for="tahun">Tahun terbit</label>
              <input id="tahun" type="text" />
            </div>
            <div>
              <label for="status">Status baca</label>
              <select id="status">
                <option>Pilih status</option>
                <option>Selesai</option>
                <option>Sedang dibaca</option>
                <option>Belum dibaca</option>
              </select>
            </div>
            <div>
              <button type="button">Simpan</button>
            </div>
          </aside>
        </div>
        <div>
          M Vyo Fachmil Fachry Setiawan - NIM 25523238 • 2026
        </div>
      </div>
    </div>
  </body>
</html>
