<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="komponen.css">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="responsif.css">
  </head>
  <body class="theme-dark page">
    <header class="site-header">
      <div class="container header-inner">
        <h1 id="site-title">Profil Saya</h1>
        <nav class="main-nav" aria-label="Navigasi utama">
          <ul>
            <li><a href="#profil-saya">Profil</a></li>
            <li><a href="#keahlian">Keahlian</a></li>
            <li><a href="#proyek">Proyek</a></li>
          </ul>
        </nav>
        <p class="meta" id="profile-meta"></p>
      </div>
    </header>

    <main class="container site-main content">
      <section id="profil-saya" class="panel" aria-labelledby="judul-profil">
        <h2 id="judul-profil">Profil Saya</h2>
        <div id="profile-intro" class="profile-intro"></div>
      </section>

      <section id="keahlian" class="panel" aria-labelledby="judul-keahlian">
        <h2 id="judul-keahlian">Keahlian</h2>
        <div id="skill-list" class="skill-list" aria-live="polite"></div>
      </section>

      <section id="proyek" class="panel" aria-labelledby="judul-proyek">
        <h2 id="judul-proyek">Proyek</h2>

        <div id="filter" class="filter-toolbar" aria-label="Filter proyek">
          <button type="button" class="filter-btn aktif" data-kategori="Semua">Semua</button>
          <button type="button" class="filter-btn" data-kategori="Buku favorit">Buku favorit</button>
          <button type="button" class="filter-btn" data-kategori="Buku yang sedang dipelajari">Buku yang sedang dipelajari</button>
          <button type="button" class="filter-btn" data-kategori="Belum dibaca">Belum dibaca</button>
          <button type="button" class="filter-btn" data-kategori="Buku referensi">Buku referensi</button>
        </div>

        <p id="pesan-kosong" hidden>Belum ada proyek dalam kategori ini.</p>
        <ul id="daftar" class="project-items" aria-live="polite"></ul>
      </section>

      <aside id="tambah-buku" class="panel sidebar" aria-labelledby="judul-tambah">
        <h2 id="judul-tambah">Status Saya</h2>
        <div id="profile-status" class="status-box"></div>

        <form id="profil-form" class="book-form" action="#" method="post" novalidate>
          <div class="field">
            <label for="nama">Nama</label>
            <input id="nama" name="nama" type="text" value="" required>
            <small class="error-message" aria-live="polite"></small>
          </div>

          <div class="field">
            <label for="nim">NIM</label>
            <input id="nim" name="nim" type="text" value="" required pattern="[0-9]{8}">
            <small class="error-message" aria-live="polite"></small>
          </div>

          <div class="field">
            <label for="tahun">Tahun</label>
            <input id="tahun" name="tahun" type="number" value="" min="1000" max="9999" required>
            <small class="error-message" aria-live="polite"></small>
          </div>

          <button type="submit">Simpan data</button>
        </form>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="container" id="footer-text"></div>
    </footer>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/dom.js"></script>
  </body>
</html>
